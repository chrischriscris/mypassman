name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo build -p mpm-syncd
      # shared relay contract suite (syncd/test/contract.test.mjs) — same
      # cases drive both relays
      - run: node syncd/test/run-contract.mjs rust
      - run: cargo build --release -p mypassman -p mpm-syncd

  syncd-worker:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: syncd
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
