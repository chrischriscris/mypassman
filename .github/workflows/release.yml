name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          # macOS: one universal binary per crate (Intel runner pool is
          # too slow to rely on — lipo both arches on the arm64 runner)
          - os: macos-14
            bin: mypassman
            universal: true
            art: universal-apple-darwin
          - os: macos-14
            bin: mpm-syncd
            universal: true
            art: universal-apple-darwin
          # linux syncd for self-hosting
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin: mpm-syncd
            art: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            bin: mpm-syncd
            cross: true
            art: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.universal && 'aarch64-apple-darwin,x86_64-apple-darwin' || matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: install cross-linker (linux arm64)
        if: matrix.cross
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: build (universal macOS)
        if: matrix.universal
        run: |
          cargo build --release -p ${{ matrix.bin }} --target aarch64-apple-darwin
          cargo build --release -p ${{ matrix.bin }} --target x86_64-apple-darwin
      - name: build
        if: ${{ !matrix.universal }}
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo build --release -p ${{ matrix.bin }} --target ${{ matrix.target }}
      - name: package
        run: |
          mkdir -p dist
          if [ "${{ matrix.universal }}" = "true" ]; then
            lipo -create \
              target/aarch64-apple-darwin/release/${{ matrix.bin }} \
              target/x86_64-apple-darwin/release/${{ matrix.bin }} \
              -output dist/${{ matrix.bin }}
          else
            cp target/${{ matrix.target }}/release/${{ matrix.bin }} dist/${{ matrix.bin }}
          fi
          tar -C dist -czf dist/${{ matrix.bin }}-${{ github.ref_name }}-${{ matrix.art }}.tar.gz ${{ matrix.bin }}
          shasum -a 256 dist/*.tar.gz >> dist/SHA256SUMS
          rm dist/${{ matrix.bin }}
      - uses: actions/upload-artifact@v4
        with:
          name: bins-${{ matrix.bin }}-${{ matrix.art }}
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: bins-*
          merge-multiple: true
      - name: create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create ${{ github.ref_name }} --title "${{ github.ref_name }}" --notes "See README.md — unsigned binaries, sha256 sums in SHA256SUMS. Verify before trusting." *.tar.gz SHA256SUMS || gh release upload ${{ github.ref_name }} *.tar.gz SHA256SUMS --clobber
