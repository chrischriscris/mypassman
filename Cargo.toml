[workspace]
resolver = "2"
members = [
    "crates/crypto",
    "crates/core",
    "crates/store",
    "crates/cli",
    "crates/syncd",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
argon2 = "0.5"
blake3 = "1"
chacha20poly1305 = "0.10"
clap = { version = "4", features = ["derive"] }
dirs = "6"
ed25519-dalek = "2"
fs2 = "0.4"
hmac = "0.12"
libc = "0.2"
rand_core = { version = "0.6", features = ["getrandom"] }
sha1 = "0.10"
sha2 = "0.10"
rpassword = "7"
thiserror = "2"
zeroize = { version = "1", features = ["derive"] }

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
